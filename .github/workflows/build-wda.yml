name: Build WebDriverAgent (unsigned, for jailbroken device) - iOS 13+

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout WebDriverAgent source
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v5.8.3
          path: WebDriverAgent

      - name: List available Xcode versions (debug)
        run: ls /Applications | grep Xcode

      # iOS 13.5.1 cần Xcode 11.x–12.x để tương thích tốt nhất
      # macos-14 thường có Xcode 15/16, dùng Xcode_15.2 là an toàn nhất
      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_14.3.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_14.3.1.app/Contents/Developer
          else
            echo "Using default Xcode"
          fi

      - name: Show Xcode and SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      # FIX 1: Bootstrap WDA dependencies trước khi build
      - name: Install dependencies (Carthage / SPM)
        working-directory: WebDriverAgent
        run: |
          # WDA v5.x dùng SPM, không cần Carthage
          # Nhưng cần resolve package trước
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -clonedSourcePackagesDirPath .packages

      # FIX 2: Build đúng cách với đủ flags cho jailbroken device
      - name: Build WebDriverAgentRunner (unsigned, iOS 13 compatible)
        working-directory: WebDriverAgent
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .packages \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            GCC_OPTIMIZATION_LEVEL=0 \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify build output
        working-directory: WebDriverAgent
        run: |
          BUILD_DIR="DerivedData/Build/Products/Debug-iphoneos"
          echo "=== Build directory contents ==="
          ls -la "$BUILD_DIR"
          echo ""
          echo "=== App bundle contents ==="
          ls -la "$BUILD_DIR/WebDriverAgentRunner-Runner.app/"
          echo ""
          echo "=== Frameworks bundled ==="
          ls "$BUILD_DIR/WebDriverAgentRunner-Runner.app/Frameworks/" 2>/dev/null || echo "No Frameworks folder"

      # FIX 3: Tạo entitlements file cho jailbreak (ldid compatible)
      - name: Create entitlements for jailbreak
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.skip-library-validation</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF

      # FIX 4: Re-sign với ldid (nếu cần cho một số jailbreak)
      # và đóng gói IPA đúng chuẩn
      - name: Package IPA (jailbreak-compatible structure)
        working-directory: WebDriverAgent
        run: |
          BUILD_DIR="DerivedData/Build/Products/Debug-iphoneos"
          APP_NAME="WebDriverAgentRunner-Runner.app"
          APP_PATH="$BUILD_DIR/$APP_NAME"

          # Xóa các ký hiệu code signing cũ (nếu có)
          rm -rf "$APP_PATH/_CodeSignature" 2>/dev/null || true

          # Cấu trúc IPA chuẩn
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Tạo IPA
          zip -r WebDriverAgentRunner-iOS13.ipa Payload/
          echo "IPA size: $(du -sh WebDriverAgentRunner-iOS13.ipa)"

      # FIX 5: Cũng tạo thêm .tar.gz của .app để dễ sideload qua SSH
      - name: Package .app as tar.gz (for SSH install on jailbroken device)
        working-directory: WebDriverAgent
        run: |
          BUILD_DIR="DerivedData/Build/Products/Debug-iphoneos"
          tar -czf WebDriverAgentRunner-app-iOS13.tar.gz \
            -C "$BUILD_DIR" \
            WebDriverAgentRunner-Runner.app
          echo "TAR size: $(du -sh WebDriverAgentRunner-app-iOS13.tar.gz)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa-iOS13
          path: WebDriverAgent/WebDriverAgentRunner-iOS13.ipa
          retention-days: 14

      - name: Upload .app as tar.gz (SSH install method)
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-app-tar-iOS13
          path: WebDriverAgent/WebDriverAgentRunner-app-iOS13.tar.gz
          retention-days: 14

      - name: Upload raw .app folder (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-app-iOS13
          path: WebDriverAgent/DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app
          retention-days: 14
