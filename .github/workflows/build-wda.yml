name: Build WebDriverAgent (iOS 13, jailbreak)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WDA v3.19.2 (tương thích iOS 13 tốt nhất)
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v3.19.2
          path: WebDriverAgent

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          else
            echo "Using default Xcode"
          fi
          xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: Resolve dependencies
        working-directory: WebDriverAgent
        run: |
          # v3.x dùng Carthage
          brew install carthage
          carthage bootstrap --platform iOS 2>/dev/null || true
          # Hoặc SPM
          xcodebuild -resolvePackageDependencies \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -clonedSourcePackagesDirPath .packages 2>/dev/null || true

      - name: Build
        working-directory: WebDriverAgent
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Create entitlements
        run: |
          cat > entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.skip-library-validation</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>com.apple.private.security.no-container</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Sign with ldid
        working-directory: WebDriverAgent
        run: |
          APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          
          # Sign main binary
          ldid -S../entitlements.plist "$APP/WebDriverAgentRunner-Runner"
          
          # Sign tất cả frameworks
          find "$APP/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) | while read f; do
            if [ -d "$f" ]; then
              name=$(basename "$f" .framework)
              [ -f "$f/$name" ] && ldid -S "$f/$name"
            else
              ldid -S "$f"
            fi
          done
          
          echo "✅ Sign xong"

      - name: Package
        working-directory: WebDriverAgent
        run: |
          APP="DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          
          # IPA
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r WebDriverAgentRunner-iOS13.ipa Payload/
          
          # tar.gz để SSH
          tar -czf WebDriverAgentRunner-iOS13.tar.gz \
            -C "DerivedData/Build/Products/Debug-iphoneos" \
            WebDriverAgentRunner-Runner.app
          
          echo "✅ IPA: $(du -sh WebDriverAgentRunner-iOS13.ipa)"
          echo "✅ TAR: $(du -sh WebDriverAgentRunner-iOS13.tar.gz)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WDA-ipa-iOS13-v3
          path: WebDriverAgent/WebDriverAgentRunner-iOS13.ipa
          retention-days: 14

      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: WDA-tar-iOS13-v3
          path: WebDriverAgent/WebDriverAgentRunner-iOS13.tar.gz
          retention-days: 14
