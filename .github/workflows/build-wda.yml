name: Build WebDriverAgent (unsigned, for jailbroken device) - iOS 13+

on:
  workflow_dispatch:   # cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  build:
    runs-on: macos-14   # Sử dụng macos-14 (Apple Silicon) để build nhanh hơn

    steps:
      - name: Checkout WebDriverAgent source
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v5.8.3        # Dùng phiên bản cũ hơn thay vì master để đảm bảo code tương thích với iOS 13
          path: WebDriverAgent

      - name: List available Xcode versions (debug)
        run: ls /Applications | grep Xcode

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_14.3.1.app/Contents/Developer
        continue-on-error: true   

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build WebDriverAgentRunner for iOS 13 (no code signing)
        working-directory: WebDriverAgent
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=13.0

      - name: Package into Payload/IPA structure
        working-directory: WebDriverAgent
        run: |
          BUILD_DIR="DerivedData/Build/Products/Debug-iphoneos"
          echo "Contents of build dir:"
          ls -la "$BUILD_DIR"
          mkdir -p Payload
          cp -R "$BUILD_DIR/WebDriverAgentRunner-Runner.app" Payload/
          zip -r WebDriverAgentRunner-iOS13.ipa Payload

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa-iOS13
          path: WebDriverAgent/WebDriverAgentRunner-iOS13.ipa
          retention-days: 14

      - name: Upload raw .app (fallback, nếu ipa lỗi cấu trúc)
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-app-iOS13
          path: WebDriverAgent/DerivedData/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app
          retention-days: 14
